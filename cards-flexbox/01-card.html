<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Card</title>
    <style>
        :root {
            --color-primary: #ffcc00;
            --color-dark: #333;
            --color-light: #f4f4f4;
        }

        /* Limpiar formato por defecto de margen de navegador*/
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--color-light);
        }
        .main-container {
            display: flex;
            align-items: center; /*vertical*/
            justify-content: center; /*horizontal*/
            height: 100vh;
        }

        .card {
            background-color: white;
            border-radius: 7px;
            padding: 20px;
            width: 250px;
            /* text-aling: center*/
            display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 1);
        }

        .card figure {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-img {
        height: 128px;
        width: 128px;
        }

        .card a {
            color: black;
            text-decoration: none;
            padding: 10px;
            border-radius:5px ;
            background-color: var(--color-primary);
        }


    </style>
</head>
<body>
    <main class="main-container">
        <div class="card">
            <h3 class="card-title">Direct Shot</h3>
            <figure>
                <img src="Directo shutamota.PNG" alt="Direct Shot" class="card-img">
                <figcaption class="card-text">Tipo: Tiro</figcaption>

            </figure>
            <a href="https://www.gamezebo.com/walkthroughs/roblox-locked-weapons/" target="_self">Ver más</a>
        </div>
    </main>
</body>
</html>
